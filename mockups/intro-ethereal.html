<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>shaan.wiki - ethereal intros</title>
<style>
  :root { --bg:#000; --fg:#fff; --quiet:#6a6a6a; --hush:#242424; }
  * { box-sizing: border-box; }
  body { margin:0; padding:30px 22px 90px; background:var(--bg); color:var(--quiet);
         font:400 12px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace; letter-spacing:.1em; }
  .wrap { max-width:1180px; margin:0 auto; }
  header { display:flex; justify-content:space-between; align-items:baseline;
           gap:20px; margin-bottom:30px; flex-wrap:wrap; }
  h1 { font:400 12px/1 ui-monospace,Menlo,monospace; letter-spacing:.28em;
       text-transform:uppercase; color:var(--fg); margin:0; }
  button { font:inherit; letter-spacing:.18em; text-transform:uppercase;
           background:none; border:1px solid var(--hush); color:var(--quiet);
           padding:8px 14px; cursor:pointer; border-radius:3px; }
  button:hover { color:var(--fg); border-color:var(--fg); }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(420px,1fr)); gap:26px; }
  .card { border:1px solid var(--hush); border-radius:4px; overflow:hidden; cursor:pointer; }
  .card canvas, .card img { display:block; width:100%; height:360px; background:#000; }
  .cap { padding:11px 14px 13px; border-top:1px solid var(--hush); }
  .cap b { color:var(--fg); font-weight:400; letter-spacing:.16em; text-transform:uppercase;
           display:block; margin-bottom:4px; }
  .cap span { color:var(--quiet); letter-spacing:.04em; text-transform:none;
              font-size:11.5px; line-height:1.55; display:block; }
  .note { margin:0 0 28px; letter-spacing:.04em; text-transform:none; font-size:12px;
          line-height:1.7; max-width:72ch; }
</style>
<body>
<div class="wrap">
  <header><h1>ethereal intros</h1><button id="all">replay all</button></header>
  <p class="note">
    Soft light instead of hard dots: every mote is a radial falloff drawn additively,
    so where they overlap they bloom. Click a card to replay. Move the pointer through
    one while it runs. All six still end completely still.
  </p>
  <div class="grid" id="grid"></div>
</div>
<script>
/* ------------------------------------------------------------------- font */
var F = {
  "s":[".###","#...",".##.","...#","###."], "h":["#..#","#..#","####","#..#","#..#"],
  "a":[".##.","#..#","####","#..#","#..#"], "n":["#..#","##.#","#.##","#..#","#..#"],
  ".":[".",".",".",".","#"], "w":["#...#","#...#","#.#.#","##.##","#...#"],
  "i":["#","#","#","#","#"], "k":["#..#","#.#.","##..","#.#.","#..#"]
};
/* A square field, like the intro it replaces. A single line of "shaan.wiki" is
   41 cells wide and forces a banner, so the name stacks: "shaan" over ".wiki".
   That reads as a wordmark rather than a strip, and it fits a square. */
var LINES = ["shaan", ".wiki"], N = 29;
var COLS = N, ROWS = N;
function nameCells() {
  var out = [], block = LINES.length * 5 + (LINES.length - 1);
  var top = Math.round((N - block) / 2);
  LINES.forEach(function (line, li) {
    var w = -1, i;
    for (i = 0; i < line.length; i++) w += F[line[i]][0].length + 1;
    var x = Math.round((N - w) / 2), y0 = top + li * 6;
    for (i = 0; i < line.length; i++) {
      var g = F[line[i]];
      for (var r = 0; r < 5; r++) for (var c = 0; c < g[r].length; c++)
        if (g[r][c] === "#") out.push([x + c, y0 + r]);
      x += g[0].length + 1;
    }
  });
  return out;
}
var NAME = nameCells();
var NAMESET = {}; NAME.forEach(function (p) { NAMESET[p[0] + "," + p[1]] = 1; });

/* ------------------------------------------------------------------ utils */
function rnd(i) { var v = Math.sin(i * 127.1 + 311.7) * 43758.5453; return v - Math.floor(v); }
function noise(x, y, t) {
  return Math.sin(x * .72 + t) * Math.cos(y * .61 - t * .8) +
         .5 * Math.sin((x + y) * .43 + t * 1.27);
}
/* a curl of the noise field: motion that circulates instead of drifting one way */
function curl(x, y, t) {
  var e = .12;
  return [ (noise(x, y + e, t) - noise(x, y - e, t)) / (2 * e),
          -(noise(x + e, y, t) - noise(x - e, y, t)) / (2 * e) ];
}
var clamp01 = function (v) { return v < 0 ? 0 : v > 1 ? 1 : v; };
var easeOut  = function (p) { return 1 - Math.pow(1 - p, 3); };
var easeInOut= function (p) { return p < .5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2; };

/* One soft sprite, drawn once and scaled. A radial falloff per mote is what
   separates light from a filled circle, and pre-rendering keeps it cheap. */
var SPRITE = (function () {
  var s = 64, c = document.createElement("canvas");
  c.width = c.height = s;
  var g = c.getContext("2d"), rad = g.createRadialGradient(s/2, s/2, 0, s/2, s/2, s/2);
  rad.addColorStop(0,   "rgba(255,255,255,1)");
  rad.addColorStop(.28, "rgba(255,255,255,.55)");
  rad.addColorStop(.62, "rgba(255,255,255,.12)");
  rad.addColorStop(1,   "rgba(255,255,255,0)");
  g.fillStyle = rad; g.fillRect(0, 0, s, s);
  return c;
})();

/* --------------------------------------------------------------- renderer */
function Eth(canvas, mode, life) {
  var ctx = canvas.getContext("2d");
  var dpr = Math.min(window.devicePixelRatio || 1, 2);
  var W = 0, H = 0, cell = 0, ox = 0, oy = 0, pts = [], t0 = 0, raf = null;
  var ptr = { x: -1e4, y: -1e4, on: false };

  function size() {
    W = canvas.clientWidth; H = canvas.clientHeight;
    canvas.width = W * dpr; canvas.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    cell = Math.min(W, H) / (N + 3);          // square cells, square field
    ox = (W - cell * (N - 1)) / 2;
    oy = (H - cell * (N - 1)) / 2;
  }
  var gx2px = function (gx) { return ox + gx * cell; };
  var gy2px = function (gy) { return oy + gy * cell; };

  function build() {
    pts = [];
    var i, n;
    if (mode === "condense" || mode === "evaporate") {
      /* free motes, not bound to the lattice: one per name cell plus a haze */
      n = NAME.length * 3;
      for (i = 0; i < n; i++) {
        var target = NAME[i % NAME.length];
        pts.push({
          tx: target[0], ty: target[1], i: i,
          seed: rnd(i) * 6.2832,
          fx: rnd(i * 3) * COLS, fy: rnd(i * 7) * ROWS,
          jx: (rnd(i * 11) - .5) * .55, jy: (rnd(i * 13) - .5) * .55,
          delay: rnd(i * 17) * 500, isName: true
        });
      }
      for (i = 0; i < 320; i++) {
        pts.push({ tx: null, i: 9000 + i, seed: rnd(i + 5) * 6.2832,
                   fx: rnd(i * 5) * COLS, fy: rnd(i * 9) * ROWS,
                   jx: 0, jy: 0, delay: rnd(i) * 700, isName: false });
      }
    } else {
      for (var y = 0; y < ROWS; y++) for (var x = 0; x < COLS; x++) {
        i = y * COLS + x;
        pts.push({ gx: x, gy: y, i: i, isName: !!NAMESET[x + "," + y],
                   seed: rnd(i) * 6.2832,
                   d: Math.hypot(x - (COLS - 1) / 2, y - (ROWS - 1) / 2),
                   delay: 0 });
      }
    }
  }

  function mote(x, y, r, a, bloom) {
    if (a <= .004 || r <= .15) return;
    ctx.globalAlpha = Math.min(1, a);
    ctx.drawImage(SPRITE, x - r, y - r, r * 2, r * 2);
    if (bloom > .01) {                      // a second, wider, fainter pass
      ctx.globalAlpha = Math.min(1, a * bloom * .5);
      var R = r * 3.4;
      ctx.drawImage(SPRITE, x - R, y - R, R * 2, R * 2);
    }
  }

  function draw(age) {
    var t = age / 1000;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.globalCompositeOperation = "source-over";
    ctx.globalAlpha = 1;
    ctx.fillStyle = "#000";
    ctx.fillRect(0, 0, W, H);
    ctx.globalCompositeOperation = "lighter";   // light adds, it does not cover

    for (var k = 0; k < pts.length; k++) {
      var p = pts[k], x = 0, y = 0, r = cell * .3, a = 0, bloom = 0;

      if (mode === "focus") {
        /* A focus pull. Everything begins as a wide, soft, out of focus haze
           and resolves to a point. Nothing moves; only the lens does. */
        var f = easeInOut(clamp01((age - 300) / 2200));
        x = gx2px(p.gx); y = gy2px(p.gy);
        var wob = (1 - f) * cell * 1.1;
        x += noise(p.gx * .4, p.gy * .4, t * .25) * wob;
        y += noise(p.gy * .4, p.gx * .4, t * .22) * wob;
        var breath = .82 + .18 * Math.sin(t * .9 + p.seed);
        if (p.isName) { r = cell * (2.6 - 2.24 * f) * breath; a = (.10 + .78 * f); bloom = .5 * f; }
        else          { r = cell * (2.2 - 1.86 * f) * breath; a = (.07 - .045 * f); bloom = 0; }
      }

      else if (mode === "breath") {
        /* Slow pulses travel out from the centre. The name holds the light a
           little longer each time, until it simply stays. */
        x = gx2px(p.gx); y = gy2px(p.gy);
        var hold = clamp01((age - 700) / 2100);
        var wave = Math.sin(t * 1.5 - p.d * .40);
        var lit  = Math.pow(clamp01(wave * .5 + .5), 2.2);
        var base = p.isName ? .06 + .74 * hold : .05;
        a = base + lit * (p.isName ? .34 * (1 - hold * .5) : .16);
        r = cell * (.34 + .3 * lit) * (p.isName ? 1 + .5 * hold : 1);
        bloom = p.isName ? .5 * hold : .12 * lit;
      }

      else if (mode === "depth") {
        /* Three planes drifting at different speeds. The name is the middle
           plane, and it is the only one that ever comes to rest. */
        var plane = p.isName ? 1 : (p.i % 2 ? 0 : 2);
        var settle = easeOut(clamp01((age - 400) / 2400));
        var sp = [.22, 0, .40][plane], amp = [1.5, 1, 2.4][plane];
        x = gx2px(p.gx) + noise(p.gx * .3, p.gy * .3, t * sp) * cell * amp * (plane === 1 ? 1 - settle : 1);
        y = gy2px(p.gy) + noise(p.gy * .3, p.gx * .3, t * sp) * cell * amp * (plane === 1 ? 1 - settle : 1);
        if (plane === 1) { r = cell * (1.5 - 1.16 * settle); a = .10 + .72 * settle; bloom = .55 * settle; }
        else if (plane === 0) { r = cell * .26; a = .085; }
        else { r = cell * 1.05; a = .045; }
      }

      else if (mode === "interference") {
        /* Two sources, and brightness is where their waves agree. The name is
           lit only where the interference lands on it. */
        x = gx2px(p.gx); y = gy2px(p.gy);
        var lock = clamp01((age - 1000) / 1900);
        var s1 = Math.hypot(p.gx - 6, p.gy - 1), s2 = Math.hypot(p.gx - (COLS - 7), p.gy - (ROWS - 2));
        var w1 = Math.sin(s1 * .55 - t * 2.2), w2 = Math.sin(s2 * .55 - t * 1.9);
        var pat = clamp01((w1 + w2) * .25 + .5);
        a = (p.isName ? .06 + .80 * lock : .05) + Math.pow(pat, 2.4) * (p.isName ? .3 * (1 - lock) : .15 * (1 - lock * .6));
        r = cell * (.32 + .26 * pat) * (p.isName ? 1 + .45 * lock : 1);
        bloom = p.isName ? .5 * lock : .1 * pat;
      }

      else if (mode === "condense") {
        /* Mist on a curl of noise. Motes circulate freely, are caught by the
           name, hold, and are released back into the drift. */
        var grip = clamp01((age - p.delay - 400) / 1700);
        var v = curl(p.fx * .18, p.fy * .18, t * .22);
        p.fx += v[0] * .028; p.fy += v[1] * .028;
        if (p.fx < -1) p.fx = COLS + 1; if (p.fx > COLS + 1) p.fx = -1;
        if (p.fy < -1) p.fy = ROWS + 1; if (p.fy > ROWS + 1) p.fy = -1;
        if (p.isName) {
          var gxx = p.tx + p.jx * (1 - grip), gyy = p.ty + p.jy * (1 - grip);
          x = gx2px(p.fx + (gxx - p.fx) * easeInOut(grip));
          y = gy2px(p.fy + (gyy - p.fy) * easeInOut(grip));
          r = cell * (.9 - .56 * grip);
          a = .10 + .72 * grip; bloom = .55 * grip;
        } else {
          x = gx2px(p.fx); y = gy2px(p.fy);
          r = cell * .8; a = .05;
        }
      }

      else if (mode === "evaporate") {
        /* The name is whole from the first frame and then leaves. The only
           version where you arrive too late and watch it go. */
        var go = clamp01((age - 1300) / 2000);
        if (p.isName) {
          var lift = go * go;
          x = gx2px(p.tx + p.jx * go * 6 + Math.sin(t * 1.2 + p.seed) * go * 1.2);
          y = gy2px(p.ty) - lift * H * .55;
          r = cell * (.34 + 1.5 * go);
          a = (1 - go) * .95; bloom = .55 * (1 - go);
        } else {
          x = gx2px(p.fx); y = gy2px(p.fy - go * 2);
          r = cell * .8; a = .05 * (1 - go * .5);
        }
      }

      if (ptr.on) {
        var dx = x - ptr.x, dy = y - ptr.y, pd = Math.hypot(dx, dy);
        var reach = Math.min(W, H) * .38;
        if (pd < reach && pd > .01) {
          var force = (1 - pd / reach);
          x += dx / pd * force * cell * 2.2;
          y += dy / pd * force * cell * 2.2;
          a += force * .10;
        }
      }
      mote(x, y, r, a, bloom);
    }
    ctx.globalCompositeOperation = "source-over";
    ctx.globalAlpha = 1;
  }

  function frame(now) {
    var age = now - t0;
    draw(age);
    if (age < life) raf = requestAnimationFrame(frame);
  }
  this.play = function () {
    cancelAnimationFrame(raf); size(); build();
    t0 = performance.now(); raf = requestAnimationFrame(frame);
  };
  /* Deterministic single frame: headless browsers do not advance rAF. */
  this.renderAt = function (age) {
    cancelAnimationFrame(raf); size(); build();
    if (mode === "condense" || mode === "evaporate") {   // stateful, so step it
      for (var s = 0; s < age; s += 16) draw(s);
    }
    requestAnimationFrame(function () {
      draw(age); requestAnimationFrame(function () { draw(age); });
    });
  };
  canvas.addEventListener("pointermove", function (e) {
    var b = canvas.getBoundingClientRect();
    ptr.x = e.clientX - b.left; ptr.y = e.clientY - b.top; ptr.on = true;
  });
  canvas.addEventListener("pointerleave", function () { ptr.on = false; });
  window.addEventListener("resize", size);
}

/* ------------------------------------------------------------------- page */
var MODES = [
  ["focus", "1 &middot; focus", 3400,
   "A focus pull. Everything begins as a wide, soft, out of focus haze and resolves to a point. Nothing moves. Only the lens does."],
  ["condense", "2 &middot; condense", 3600,
   "Mist on a curl of noise. Motes circulate freely, are caught by the name, hold, and are released back into the drift."],
  ["breath", "3 &middot; breath", 3600,
   "Slow pulses travel out from the centre. The name holds the light a little longer each time, until it simply stays."],
  ["depth", "4 &middot; depth", 3400,
   "Three planes drifting at different speeds. The name is the middle plane, and the only one that ever comes to rest."],
  ["interference", "5 &middot; interference", 3600,
   "Two sources, and brightness is where their waves agree. The name is lit only where the interference lands on it."],
  ["evaporate", "6 &middot; evaporate", 3800,
   "The name is whole from the first frame and then leaves. The only one where you arrive too late and watch it go."]
];
var made = [], grid = document.getElementById("grid");
MODES.forEach(function (m) {
  var card = document.createElement("div");
  card.className = "card";
  card.innerHTML = '<canvas></canvas><div class="cap"><b>' + m[1] + '</b><span>' + m[3] + '</span></div>';
  grid.appendChild(card);
  var it = new Eth(card.querySelector("canvas"), m[0], m[2]);
  made.push(it);
  card.addEventListener("click", function () { it.play(); });
});
function playAll() { made.forEach(function (i, n) { setTimeout(function () { i.play(); }, n * 80); }); }
document.getElementById("all").addEventListener("click", playAll);

var q = new URLSearchParams(location.search);
window.addEventListener("load", function () {
  var at = q.get("frame");
  if (at === null) { playAll(); return; }
  made.forEach(function (i) { i.renderAt(+at); });
  if (q.get("still")) {
    /* Canvases do not composite into headless screenshots here. */
    setTimeout(function () {
      document.querySelectorAll("canvas").forEach(function (c) {
        var img = new Image(); img.src = c.toDataURL("image/png");
        c.parentNode.replaceChild(img, c);
      });
    }, 800);
  }
});
</script>
