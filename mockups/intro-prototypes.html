<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>shaan.wiki - intro prototypes</title>
<style>
  :root { --bg:#000; --fg:#fff; --quiet:#6a6a6a; --hush:#2a2a2a; }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 30px 22px 90px; background: var(--bg); color: var(--quiet);
    font: 400 12px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace;
    letter-spacing: .1em;
  }
  .wrap { max-width: 1180px; margin: 0 auto; }
  header { display: flex; justify-content: space-between; align-items: baseline;
           gap: 20px; margin-bottom: 34px; flex-wrap: wrap; }
  h1 { font: 400 12px/1 ui-monospace, Menlo, monospace; letter-spacing: .28em;
       text-transform: uppercase; color: var(--fg); margin: 0; }
  button {
    font: inherit; letter-spacing: .18em; text-transform: uppercase;
    background: none; border: 1px solid var(--hush); color: var(--quiet);
    padding: 8px 14px; cursor: pointer; border-radius: 3px;
  }
  button:hover { color: var(--fg); border-color: var(--fg); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(520px, 1fr));
          gap: 26px; }
  .card { border: 1px solid var(--hush); border-radius: 4px; overflow: hidden;
          cursor: pointer; }
  .card canvas { display: block; width: 100%; height: 250px; background: #000; }
  .card .cap { padding: 11px 14px 13px; border-top: 1px solid var(--hush); }
  .card .cap b { color: var(--fg); font-weight: 400; letter-spacing: .16em;
                 text-transform: uppercase; display: block; margin-bottom: 4px; }
  .card .cap span { color: var(--quiet); letter-spacing: .04em; text-transform: none;
                    font-size: 11.5px; line-height: 1.55; display: block; }
  .note { margin: 0 0 30px; letter-spacing: .04em; text-transform: none;
          font-size: 12px; line-height: 1.7; max-width: 70ch; }
</style>
<body>
<div class="wrap">
  <header>
    <h1>intro prototypes</h1>
    <button id="all">replay all</button>
  </header>
  <p class="note">
    Six ideas about how the dots and the name relate. Click any one to replay it.
    Move the pointer over a card while it runs. All six are the same lattice, the
    same monochrome, and all six end completely still.
  </p>
  <div class="grid" id="grid"></div>
</div>

<script>
/* ------------------------------------------------------------------ font */
var F = {
  "s": [".###","#...",".##.","...#","###."],
  "h": ["#..#","#..#","####","#..#","#..#"],
  "a": [".##.","#..#","####","#..#","#..#"],
  "n": ["#..#","##.#","#.##","#..#","#..#"],
  ".": [".",".",".",".","#"],
  "w": ["#...#","#...#","#.#.#","##.##","#...#"],
  "i": ["#","#","#","#","#"],
  "k": ["#..#","#.#.","##..","#.#.","#..#"]
};
var WORD = "shaan.wiki";
var COLS = 49, ROWS = 11;          // field
var NAME_ROW = 3;                  // name occupies rows 4..8

function nameCells() {
  var gw = 0, ch;
  for (var i = 0; i < WORD.length; i++) gw += F[WORD[i]][0].length + 1;
  gw -= 1;
  var x0 = Math.round((COLS - gw) / 2), set = {}, x = x0;
  for (i = 0; i < WORD.length; i++) {
    ch = F[WORD[i]];
    for (var r = 0; r < 5; r++)
      for (var c = 0; c < ch[r].length; c++)
        if (ch[r][c] === "#") set[(x + c) + "," + (NAME_ROW + r)] = 1;
    x += ch[0].length + 1;
  }
  return set;
}
var NAME = nameCells();

/* ----------------------------------------------------------------- utils */
function rnd(i) { var v = Math.sin(i * 127.1 + 311.7) * 43758.5453; return v - Math.floor(v); }
function noise(x, y, t) {
  return Math.sin(x * .72 + t) * Math.cos(y * .61 - t * .8) +
         .5 * Math.sin((x + y) * .43 + t * 1.27);
}
var easeOut = function (p) { return 1 - Math.pow(1 - p, 3); };
var clamp01 = function (v) { return v < 0 ? 0 : v > 1 ? 1 : v; };

/* ---------------------------------------------------------------- engine */
function Intro(canvas, mode, life) {
  var ctx = canvas.getContext("2d");
  var dpr = Math.min(window.devicePixelRatio || 1, 2);
  var W = 0, H = 0, cell = 0, ox = 0, oy = 0;
  var pts = [], t0 = 0, raf = null;
  var ptr = { x: -1e4, y: -1e4, on: false };

  function size() {
    W = canvas.clientWidth; H = canvas.clientHeight;
    canvas.width = W * dpr; canvas.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    cell = Math.min(W / (COLS + 2), H / (ROWS + 2));
    ox = (W - cell * (COLS - 1)) / 2;
    oy = (H - cell * (ROWS - 1)) / 2;
  }

  function build() {
    pts = [];
    var midx = (COLS - 1) / 2, midy = (ROWS - 1) / 2;
    for (var y = 0; y < ROWS; y++) for (var x = 0; x < COLS; x++) {
      var i = y * COLS + x, isName = !!NAME[x + "," + y];
      var ang = rnd(i) * 6.2832, far = .5 + rnd(i + 7919) * .9;
      pts.push({
        gx: x, gy: y, isName: isName, i: i,
        hx: 0, hy: 0,
        ox: Math.cos(ang) * far, oy: Math.sin(ang) * far,
        d: Math.hypot(x - midx, y - midy),
        dx: (x - midx) / midx, dy: (y - midy) / midy,
        delay: 0, x: 0, y: 0, r: 0, a: 0
      });
    }
    // per mode staggering
    pts.forEach(function (p) {
      if (mode === "gather")  p.delay = (p.d / 12) * 520 + rnd(p.i + 5) * 240;
      if (mode === "surface") p.delay = rnd(p.i) * 260;
      if (mode === "displace")p.delay = rnd(p.i) * 200;
      if (mode === "sweep")   p.delay = (p.gx / COLS) * 900;
      if (mode === "accrete") p.delay = p.isName ? (p.gx / COLS) * 1500 + rnd(p.i) * 90
                                                 : rnd(p.i) * 400;
      if (mode === "orbit")   p.delay = rnd(p.i) * 300;
    });
  }

  function home(p) { p.hx = ox + p.gx * cell; p.hy = oy + p.gy * cell; }

  function frame(now) {
    var age = now - t0;
    draw(age);
    if (age < life) raf = requestAnimationFrame(frame);
  }

  /* Drawing is a pure function of age, so a single moment can be rendered
     deterministically. Headless browsers do not advance requestAnimationFrame
     reliably, and a screenshot of a half started animation says nothing. */
  function draw(age) {
    var t = age / 1000;
    ctx.clearRect(0, 0, W, H);

    for (var k = 0; k < pts.length; k++) {
      var p = pts[k];
      home(p);
      var l = clamp01((age - p.delay) / 700), e = easeOut(l);
      if (l <= 0) continue;

      var x = p.hx, y = p.hy, r = cell * .17, a = .22;

      if (mode === "gather") {
        /* Everything flies in from scatter. The name lands bright and large,
           the field lands dim: one arrival, two weights. */
        x = p.hx + p.ox * W * (1 - e);
        y = p.hy + p.oy * H * (1 - e);
        var br = .6 + .4 * Math.sin(t * 1.1 - p.d * .4);
        r = cell * (p.isName ? .30 : .13) * e * (p.isName ? 1 : (.6 + .4 * br));
        a = e * (p.isName ? .95 : .20);
      }

      else if (mode === "surface") {
        /* A uniform breathing field. The name does not arrive, it surfaces:
           its dots swell and brighten while the rest sink away. */
        var reveal = clamp01((age - 900) / 1400);
        x = p.hx + noise(p.gx * .5, p.gy * .5, t * .34) * cell * .34 * (1 - reveal * .8);
        y = p.hy + noise(p.gy * .5, p.gx * .5, t * .31) * cell * .34 * (1 - reveal * .8);
        r = cell * (.16 + (p.isName ? .17 : -.09) * reveal) * e;
        a = e * (p.isName ? .30 + .65 * reveal : .30 - .22 * reveal);
      }

      else if (mode === "displace") {
        /* The name is a solid body pushing into the field. Nothing spells it:
           the dots are shoved aside and the name is the space left behind. */
        var push = clamp01((age - 700) / 1300);
        if (p.isName) { r = 0; a = 0; }
        else {
          /* Pushed only as far as the next cell. Further than that and the
             field folds into a blob and the letter shaped void disappears,
             which is the whole idea. */
          var near = nearestNameDist(p.gx, p.gy);
          var force = Math.max(0, 1 - near / 2.6) * push;
          var ang3 = nearestNameAngle(p.gx, p.gy);
          x = p.hx + Math.cos(ang3) * force * cell * .9;
          y = p.hy + Math.sin(ang3) * force * cell * .9;
          r = cell * (.15 + .05 * force) * e;
          a = e * (.26 + .62 * force);
        }
      }

      else if (mode === "sweep") {
        /* A wave crosses left to right. Ahead of it, drifting noise. Behind it,
           the lattice is locked and the name is lit. */
        var head = (age / 1300) * COLS;
        var passed = clamp01(head - p.gx);
        x = p.hx + noise(p.gx * .5, p.gy * .5, t * .5) * cell * .5 * (1 - passed);
        y = p.hy + noise(p.gy * .5, p.gx * .5, t * .5) * cell * .5 * (1 - passed);
        var lit = p.isName ? passed : 0;
        r = cell * (.14 + .16 * lit) * e;
        a = e * (.18 + .78 * lit) * (p.isName ? 1 : .9);
        if (Math.abs(head - p.gx) < 1.2) { a = Math.min(1, a + .5); r += cell * .06; }
      }

      else if (mode === "accrete") {
        /* The name fills in one dot at a time, left to right, the way days
           accumulate. The field is just the empty calendar behind it. */
        if (p.isName) {
          var arrive = clamp01((age - p.delay) / 260);
          r = cell * .30 * easeOut(arrive);
          a = arrive;
          y = p.hy - (1 - easeOut(arrive)) * cell * .8;
        } else {
          r = cell * .12 * e; a = e * .16;
        }
      }

      else if (mode === "orbit") {
        /* Every dot circles its own cell. The name's dots slow and stop first,
           so order appears inside a field that is still turning. */
        var lock = clamp01((age - 800) / 1500);
        var spin = p.isName ? (1 - lock) : (1 - lock * .35);
        var ang2 = t * 1.6 + rnd(p.i) * 6.28;
        x = p.hx + Math.cos(ang2) * cell * .55 * spin;
        y = p.hy + Math.sin(ang2) * cell * .55 * spin;
        r = cell * (p.isName ? .14 + .16 * lock : .13) * e;
        a = e * (p.isName ? .3 + .65 * lock : .22);
      }

      if (ptr.on) {
        var ddx = x - ptr.x, ddy = y - ptr.y, pd = Math.hypot(ddx, ddy);
        var reach = Math.min(W, H) * .34;
        if (pd < reach && pd > .01) {
          var f = (1 - pd / reach) * cell * 1.9;
          x += ddx / pd * f; y += ddy / pd * f;
        }
      }

      if (r <= .12 || a <= .01) continue;
      ctx.globalAlpha = Math.min(1, a);
      ctx.beginPath();
      ctx.arc(x, y, r, 0, 6.2832);
      ctx.fillStyle = "#fff";
      ctx.fill();
    }

    ctx.globalAlpha = 1;
  }

  var naCache = {};
  function nearestNameAngle(x, y) {
    var key = x + "," + y;
    if (naCache[key] !== undefined) return naCache[key];
    var best = 1e9, bx = x, by = y;
    for (var k in NAME) {
      var q = k.split(","), d = Math.hypot(x - q[0], y - q[1]);
      if (d < best) { best = d; bx = +q[0]; by = +q[1]; }
    }
    return (naCache[key] = Math.atan2(y - by, x - bx));
  }

  var ndCache = {};
  function nearestNameDist(x, y) {
    var key = x + "," + y;
    if (ndCache[key] !== undefined) return ndCache[key];
    var best = 99;
    for (var k in NAME) {
      var p = k.split(","), d = Math.hypot(x - p[0], y - p[1]);
      if (d < best) best = d;
    }
    return (ndCache[key] = best);
  }

  this.renderAt = function (age) {
    cancelAnimationFrame(raf);
    size(); build();
    /* Painted inside a frame, twice. A canvas drawn synchronously during load
       is not always committed to the compositor before a headless screenshot
       is taken, which makes the capture look empty when it is not. */
    requestAnimationFrame(function () {
      draw(age);
      requestAnimationFrame(function () { draw(age); });
    });
  };
  this.play = function () {
    cancelAnimationFrame(raf);
    size(); build();
    t0 = performance.now();
    raf = requestAnimationFrame(frame);
  };
  canvas.addEventListener("pointermove", function (e) {
    var b = canvas.getBoundingClientRect();
    ptr.x = e.clientX - b.left; ptr.y = e.clientY - b.top; ptr.on = true;
  });
  canvas.addEventListener("pointerleave", function () { ptr.on = false; });
  window.addEventListener("resize", size);
}

/* ------------------------------------------------------------------ page */
var MODES = [
  ["gather",  "1 &middot; gather",
   "Every dot flies in from somewhere random and finds its place. The name lands bright, the field lands dim. One arrival, two weights."],
  ["surface", "2 &middot; surface",
   "A uniform breathing field. The name does not arrive, it surfaces: its dots swell and brighten while the rest sink away."],
  ["displace","3 &middot; displace",
   "The name is a solid body pushing into the field. Nothing spells it. The dots are shoved aside and the name is the space left behind."],
  ["sweep",   "4 &middot; sweep",
   "A wave crosses left to right. Ahead of it, drifting noise. Behind it, the lattice is locked and the name is lit."],
  ["accrete", "5 &middot; accrete",
   "The name fills in one dot at a time, left to right, the way days accumulate. The field is the empty calendar behind it."],
  ["orbit",   "6 &middot; orbit",
   "Every dot circles its own cell. The name's dots slow and stop first, so order appears inside a field that is still turning."]
];

var made = [];
var grid = document.getElementById("grid");
MODES.forEach(function (m) {
  var card = document.createElement("div");
  card.className = "card";
  card.innerHTML = '<canvas></canvas><div class="cap"><b>' + m[1] +
                   '</b><span>' + m[2] + '</span></div>';
  grid.appendChild(card);
  var life = m[0] === "accrete" ? 3600 : 3200;
  var it = new Intro(card.querySelector("canvas"), m[0], life);
  made.push(it);
  card.addEventListener("click", function () { it.play(); });
});
function playAll() { made.forEach(function (i, n) { setTimeout(function () { i.play(); }, n * 90); }); }
document.getElementById("all").addEventListener("click", playAll);

var at = new URLSearchParams(location.search).get("frame");
window.addEventListener("load", function () {
  if (at !== null) { made.forEach(function (i) { i.renderAt(+at); }); }
  else playAll();
});
</script>
